<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SerebraCode</title>
<style>
@font-face{font-family:"Nekst Mono";src:url("./NekstMono-Regular.woff2") format("woff2"),url("./NekstMono-Regular.woff") format("woff");font-weight:400;font-display:swap}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding:24px;color:#111;background:#fff;font:400 24px/1.45 "Nekst Mono",monospace}
header{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin-bottom:48px}
.brand{font-size:inherit;text-decoration:none}
nav{display:flex;gap:24px}
a{color:inherit;text-underline-offset:4px}
nav a{text-decoration:none}
a:hover{text-decoration:underline}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 24px}
.preview{display:flex;aspect-ratio:4/3;align-items:center;justify-content:center;background:#f2f2f2;overflow:hidden}
.preview svg,.preview img{display:block;width:100%;height:100%;object-fit:cover}
h1,h2,p{font-size:inherit;font-weight:400;margin:0}
article h2{margin-top:16px}
article p{margin:4px 0 12px;color:#666}
#info{max-width:65ch}
#info[hidden],#projects[hidden]{display:none}
#info p{margin-top:8px;max-width:65ch}
@media(max-width:900px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){body{padding:16px}header{gap:12px;margin-bottom:32px;flex-wrap:wrap}nav{gap:16px}.projects{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="brand" href="./">SerebraCode</a><nav aria-label="Main"><a href="#projects">Projects</a><a href="#info">Info</a></nav></header>
<main>
<section class="projects" id="projects" aria-label="Projects">
<article>
<a class="preview" href="https://github.com/serebracode/nibb" aria-label="Nibb on GitHub">
<svg viewBox="0 0 640 480" role="img" aria-label="Nibb typographic placeholder"><text x="320" y="240" text-anchor="middle" dominant-baseline="central" font-size="80" fill="#111" font-family="Nekst Mono,monospace">Nibb</text></svg>
</a>
<h2>Nibb for Glyphs</h2>
<p>A drawing tool for Glyphs.</p>
<a href="https://github.com/serebracode/nibb">GitHub ↗</a>
</article>
</section>
<section id="info" hidden><h2>Info</h2><p>Independent projects by Denis Serebryakov.</p></section>
</main>
<script>
function showPage(){const info=location.hash==="#info";document.getElementById("projects").hidden=info;document.getElementById("info").hidden=!info;}
window.addEventListener("hashchange",showPage);showPage();
</script>
</body>
</html>
